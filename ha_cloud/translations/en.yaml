configuration:
  domains:
    name: "Domains"
    description: "Your hassdns.com FQDNs, one per line"
  token:
    name: "API token"
    description: "Account token (64 hex) or per-record token (40 hex)"
  seconds:
    name: "Update interval (seconds)"
    description: "How often the public IP is published"
  lets_encrypt:
    name: "Let's Encrypt"
    description: "Automatic certificate via DNS-01"
    accept_terms:
      name: "Accept Let's Encrypt ToS"
      description: "Required to issue certificates"
    certfile:
      name: "Certificate filename"
      description: "Saved under /ssl/"
    keyfile:
      name: "Private key filename"
      description: "Saved under /ssl/"
    algo:
      name: "Key algorithm"
      description: "secp384r1 (default), secp256r1 or rsa"
    server:
      name: "ACME server"
      description: "Let's Encrypt directory URL"
