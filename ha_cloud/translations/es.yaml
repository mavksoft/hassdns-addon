configuration:
  domains:
    name: "Dominios"
    description: "Tus FQDN de ha-cloud.es, uno por línea"
  token:
    name: "Token de API"
    description: "Token de cuenta (64 hex) o del registro (40 hex)"
  seconds:
    name: "Intervalo de actualización (segundos)"
    description: "Cada cuánto se publica la IP pública"
  lets_encrypt:
    name: "Let's Encrypt"
    description: "Automatic certificate via DNS-01"
    accept_terms:
      name: "Aceptar ToS de Let's Encrypt"
      description: "Necesario para emitir certificados"
    certfile:
      name: "Nombre del certificado"
      description: "Se guarda en /ssl/"
    keyfile:
      name: "Nombre de la clave privada"
      description: "Se guarda en /ssl/"
    algo:
      name: "Algoritmo de clave"
      description: "secp384r1 (defecto), secp256r1 o rsa"
    server:
      name: "Servidor ACME"
      description: "URL del directorio de Let's Encrypt"
