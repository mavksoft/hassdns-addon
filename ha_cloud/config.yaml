name: "HassDNS DNS"
description: "DNS dinámico en hassdns.com (y ha-cloud.es) + certificado Let's Encrypt automático por DNS-01"
version: "1.3.6"
slug: ha_cloud
init: false
url: "https://github.com/mavksoft/hassdns-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
ingress: true
ingress_port: 8099
panel_icon: "mdi:dns"
panel_title: "HassDNS"
boot: auto
map:
  - ssl:rw
options:
  domains: []
  token: ""
  duckdns_token: ""
  seconds: 300
  lets_encrypt:
    accept_terms: false
    certfile: hassdns_fullchain.pem
    keyfile: hassdns_privkey.pem
    algo: secp384r1
    server: https://acme-v02.api.letsencrypt.org/directory
schema:
  domains:
    - match(^(?:\*\.|_acme-challenge\.)?[a-z0-9][a-z0-9_-]*\.(?:hassdns\.com|ha-cloud\.es|duckdns\.org)$)
  token: "match(^[a-f0-9]{40,64}$)"
  duckdns_token: str
  seconds: "int(60,)"
  lets_encrypt:
    accept_terms: bool
    certfile: str
    keyfile: str
    algo: list(secp384r1|secp256r1|rsa)?
    server: url?
