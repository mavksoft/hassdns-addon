name: "HassDNS DNS"
description: "DNS dinámico en hassdns.com (y ha-cloud.es) + certificado Let's Encrypt automático por DNS-01"
version: "1.1.3"
slug: ha_cloud
init: false
url: "https://github.com/mavksoft/hassdns-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
map:
  - ssl:rw
options:
  domains: []
  token: ""
  seconds: 300
  lets_encrypt:
    accept_terms: false
    certfile: fullchain.pem
    keyfile: privkey.pem
    algo: secp384r1
    server: https://acme-v02.api.letsencrypt.org/directory
schema:
  domains:
    - match(^(?:\*\.|_acme-challenge\.)?[a-z0-9][a-z0-9_-]*\.(?:hassdns\.com|ha-cloud\.es)$)
  token: "match(^[a-f0-9]{40,64}$)"
  seconds: "int(60,)"
  lets_encrypt:
    accept_terms: bool
    certfile: str
    keyfile: str
    algo: list(secp384r1|secp256r1|rsa)?
    server: url?
